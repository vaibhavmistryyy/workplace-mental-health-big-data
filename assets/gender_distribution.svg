<svg width="600" height="350" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white" rx="8"/>
  <text x="300" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a202c" text-anchor="middle">Normalized Gender Distribution in Tech Workforce</text>
  <text x="300" y="58" font-family="Arial, sans-serif" font-size="12" fill="#718096" text-anchor="middle">Categorized from 40+ raw free-text survey inputs via Spark SQL</text>
  
  <!-- Y-Axis Grid Lines -->
  <line x1="80" y1="270" x2="540" y2="270" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="80" y1="215" x2="540" y2="215" stroke="#edf2f7" stroke-dasharray="4"/>
  <line x1="80" y1="160" x2="540" y2="160" stroke="#edf2f7" stroke-dasharray="4"/>
  <line x1="80" y1="105" x2="540" y2="105" stroke="#edf2f7" stroke-dasharray="4"/>

  <text x="70" y="274" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0" text-anchor="end">0</text>
  <text x="70" y="219" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0" text-anchor="end">300</text>
  <text x="70" y="164" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0" text-anchor="end">600</text>
  <text x="70" y="109" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0" text-anchor="end">900</text>
  
  <!-- Bar 1: Male (971) -> height = 971 / 1000 * 180 = 175 px -->
  <rect x="130" y="95" width="85" height="175" rx="4" fill="#2b6cb0"/>
  <text x="172" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2b6cb0" text-anchor="middle">971 (77%)</text>
  <text x="172" y="292" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2d3748" text-anchor="middle">Male</text>
  
  <!-- Bar 2: Female (236) -> height = 236 / 1000 * 180 = 42.5 px -->
  <rect x="260" y="227" width="85" height="43" rx="4" fill="#dd6b20"/>
  <text x="302" y="217" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dd6b20" text-anchor="middle">236 (19%)</text>
  <text x="302" y="292" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2d3748" text-anchor="middle">Female</text>

  <!-- Bar 3: Others / Non-Binary (52) -> height = 52 / 1000 * 180 = 9.4 px -->
  <rect x="390" y="260" width="85" height="10" rx="3" fill="#805ad5"/>
  <text x="432" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#805ad5" text-anchor="middle">52 (4%)</text>
  <text x="432" y="292" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2d3748" text-anchor="middle">Others / Enby</text>
  
  <text x="300" y="330" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0" text-anchor="middle">Source: Spark SQL Aggregation on Mental Health Tech Survey Dataset</text>
</svg>