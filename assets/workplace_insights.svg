<svg width="700" height="340" viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white" rx="8"/>
  
  <!-- Left: Supervisor Support -->
  <text x="200" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a202c" text-anchor="middle">Supervisor Support Breakdown</text>
  <circle cx="200" cy="150" r="80" fill="#edf2f7"/>
  <!-- Pie slice simulation -->
  <path d="M 200 150 L 200 70 A 80 80 0 0 1 278 175 Z" fill="#3182ce"/>
  <path d="M 200 150 L 278 175 A 80 80 0 0 1 143 206 Z" fill="#dd6b20"/>
  <path d="M 200 150 L 143 206 A 80 80 0 0 1 200 70 Z" fill="#718096"/>
  <circle cx="200" cy="150" r="45" fill="white"/>
  <text x="200" y="155" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2d3748" text-anchor="middle">Treatment</text>
  
  <!-- Legend Left -->
  <circle cx="100" cy="260" r="6" fill="#3182ce"/>
  <text x="115" y="264" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">Yes (39%)</text>
  <circle cx="200" cy="260" r="6" fill="#dd6b20"/>
  <text x="215" y="264" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">Some of them (32%)</text>
  <circle cx="100" cy="285" r="6" fill="#718096"/>
  <text x="115" y="289" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">No (29%)</text>

  <!-- Right: Wellness Program -->
  <text x="520" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a202c" text-anchor="middle">Wellness Program Access</text>
  <circle cx="520" cy="150" r="80" fill="#edf2f7"/>
  <path d="M 520 150 L 520 70 A 80 80 0 1 1 445 180 Z" fill="#e53e3e"/>
  <path d="M 520 150 L 445 180 A 80 80 0 0 1 490 73 Z" fill="#3182ce"/>
  <path d="M 520 150 L 490 73 A 80 80 0 0 1 520 70 Z" fill="#ecc94b"/>
  <circle cx="520" cy="150" r="45" fill="white"/>
  <text x="520" y="155" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2d3748" text-anchor="middle">Access</text>

  <!-- Legend Right -->
  <circle cx="440" cy="260" r="6" fill="#e53e3e"/>
  <text x="455" y="264" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">No Access (66% / 420)</text>
  <circle cx="440" cy="285" r="6" fill="#3182ce"/>
  <text x="455" y="289" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">Has Access (21%)</text>
  <circle cx="440" cy="310" r="6" fill="#ecc94b"/>
  <text x="455" y="314" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">Don't Know (13%)</text>
</svg>